name: Deploy production site

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "preview/**"
      - "content/**"
      - "data/content_registry.json"
      - "config/site.json"
      - "templates/**"
      - "scripts/**"
      - "pyproject.toml"
      - "tests/**"
      - ".github/workflows/deploy-production.yml"

concurrency:
  group: production-ftp-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e .

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build production files
        run: python scripts/build_public.py

      - name: Check JavaScript syntax
        run: |
          node --check public/bousai_common.js
          node --check public/bousai_home.js

      - name: Localize Commons site images
        run: python scripts/localize_commons_images.py --min-localized 1

      - name: Show production manifest
        run: |
          echo "HTML files: $(find public -type f -name '*.html' | wc -l)"
          echo "Total files: $(find public -type f | wc -l)"
          find public -type f | sort

      - name: Deploy to Ninja Homepage via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ftp.homepage.shinobi.jp
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./public/
          server-dir: ./
          dangerous-clean-slate: false
          log-level: standard
          security: strict
          timeout: 60000
          exclude: |
            realtime/**

      - name: Smoke test public site
        run: |
          BASE_URL="$(python - <<'PY'
          import json
          with open("config/site.json", encoding="utf-8") as f:
              print(json.load(f)["public_base_url"].rstrip("/") + "/")
          PY
          )"
          echo "Testing ${BASE_URL}"

          check_page() {
            path="$1"
            tmp="$(mktemp)"
            curl --fail --silent --show-error --location \
              --retry 4 --retry-delay 5 --retry-all-errors \
              "${BASE_URL}${path}" -o "${tmp}"
            grep -q "防災くらしガイド" "${tmp}"
            rm -f "${tmp}"
          }

          check_page_contains() {
            path="$1"
            pattern="$2"
            tmp="$(mktemp)"
            curl --fail --silent --show-error --location \
              --retry 4 --retry-delay 5 --retry-all-errors \
              "${BASE_URL}${path}" -o "${tmp}"
            grep -Fq "${pattern}" "${tmp}"
            rm -f "${tmp}"
          }

          check_asset() {
            path="$1"
            curl --fail --silent --show-error --location \
              --retry 4 --retry-delay 5 --retry-all-errors \
              "${BASE_URL}${path}" -o /dev/null
          }

          check_structured_page() {
            path="$1"
            tmp="$(mktemp)"
            curl --fail --silent --show-error --location \
              --retry 4 --retry-delay 5 --retry-all-errors \
              "${BASE_URL}${path}" -o "${tmp}"
            grep -q 'data-generated="article-structured-data"' "${tmp}"
            grep -q '"@type":"BlogPosting"' "${tmp}"
            grep -q '"@type":"BreadcrumbList"' "${tmp}"
            rm -f "${tmp}"
          }

          check_page ""
          check_page "qa.html"
          check_page "guide/first-disaster-preparedness.html"
          check_page "vehicle/car-flood-submersion.html"
          check_page "goods/portable-power-station-disaster.html"
          check_page "goods/index.html"
          check_page "goods/toilet-hygiene.html"
          check_page "water-outage/portable-toilet-stockpile.html"
          check_page "insurance/flooded-car-insurance.html"
          check_page "insurance/fire-insurance-water-damage.html"
          check_page "insurance/household-goods-flood-insurance.html"
          check_page "insurance/typhoon-wind-damage-insurance.html"
          check_page "home/home-flood-preparedness.html"
          check_page "post-disaster/after-flood-record-evidence.html"
          check_page "home/home-heavy-rain-checklist.html"
          check_page "typhoon/typhoon-day-before-checklist.html"
          check_page "home/apartment-typhoon-flood.html"
          check_structured_page "guide/first-disaster-preparedness.html"
          check_structured_page "guide/emergency-food-expiration.html"
          check_structured_page "guide/pet-disaster-preparedness.html"
          check_structured_page "guide/baby-disaster-stockpile.html"
          check_structured_page "guide/senior-disaster-preparedness.html"
          check_structured_page "insurance/flooded-car-insurance.html"
          check_structured_page "insurance/fire-insurance-water-damage.html"
          check_structured_page "insurance/household-goods-flood-insurance.html"
          check_structured_page "insurance/typhoon-wind-damage-insurance.html"
          check_structured_page "home/home-flood-preparedness.html"
          check_structured_page "post-disaster/after-flood-record-evidence.html"
          check_structured_page "home/home-heavy-rain-checklist.html"
          check_structured_page "typhoon/typhoon-day-before-checklist.html"
          check_structured_page "home/apartment-typhoon-flood.html"
          check_asset "bousai_common.css"
          check_asset "bousai_common.js"
          check_asset "bousai_home.css"
          check_asset "bousai_home.js"
          check_asset "sitemap.xml"
          check_asset "robots.txt"
          check_asset "assets/images/commons/manifest.json"
          check_asset "realtime/realtime.json"

          # Expert-review changes must be present on the actual production pages.
          check_page_contains "" 'class="skip-link"'
          check_page_contains "" 'id="main-content"'
          check_page_contains "" '携帯トイレの備え方を読む'
          check_page_contains "" 'href="goods/toilet-hygiene.html">携帯トイレ</a>'
          check_page_contains "" 'href="goods/light-information.html">ライト・ラジオ</a>'
          check_page_contains "" 'href="goods/power-charging.html">ポータブル電源</a>'
          check_page_contains "goods/index.html" 'category-product-link'
          check_page_contains "goods/index.html" '<small>商品比較</small>'
          check_page_contains "goods/toilet-hygiene.html" 'class="article-shell product-page"'
          check_page_contains "goods/toilet-hygiene.html" 'class="site-nav"'
          check_page_contains "goods/toilet-hygiene.html" '商品情報より'
          check_page_contains "water-outage/portable-toilet-stockpile.html" '断水時の携帯トイレ'
          check_page_contains "guide/first-disaster-preparedness.html" 'class="skip-link"'
          check_page_contains "guide/first-disaster-preparedness.html" 'id="main-content"'
          check_page_contains "insurance/flooded-car-insurance.html" '令和8年8月27日からの大雨に伴う災害'
          check_page_contains "insurance/fire-insurance-water-damage.html" '令和8年8月27日からの大雨に伴う災害'
          check_page_contains "insurance/household-goods-flood-insurance.html" '令和8年8月27日からの大雨に伴う災害'
          check_page_contains "insurance/typhoon-wind-damage-insurance.html" '古くなった自宅の修理に保険金を使えるか'
          check_page_contains "insurance/typhoon-wind-damage-insurance.html" '住宅の修理などに関するトラブルにご注意'
          check_page_contains "home/home-flood-preparedness.html" '001349327.pdf'
          check_page_contains "post-disaster/after-flood-record-evidence.html" '罹災証明書の提出は原則不要'
          check_page_contains "post-disaster/after-flood-record-evidence.html" '住宅の修理などに関するトラブルにご注意'
          check_page_contains "home/home-heavy-rain-checklist.html" '001349327.pdf'
          check_page_contains "typhoon/typhoon-day-before-checklist.html" '家の対策を完成させるまで避難を待たない'
          check_page_contains "home/apartment-typhoon-flood.html" '建築物における電気設備の浸水対策ガイドライン'

          tmp_home="$(mktemp)"
          curl --fail --silent --show-error --location \
            --retry 4 --retry-delay 5 --retry-all-errors \
            "${BASE_URL}" -o "${tmp_home}"
          if grep -Eq 'src="https://(commons|upload)\.wikimedia\.org/' "${tmp_home}"; then
            echo "Homepage Commons images must be local, but external Wikimedia src remains."
            exit 1
          fi
          grep -q 'assets/images/commons/' "${tmp_home}"
          grep -q 'data-realtime-root' "${tmp_home}"
          rm -f "${tmp_home}"

          tmp_js="$(mktemp)"
          curl --fail --silent --show-error --location \
            --retry 4 --retry-delay 5 --retry-all-errors \
            "${BASE_URL}bousai_common.js" -o "${tmp_js}"
          grep -q '"amazon_click"' "${tmp_js}"
          grep -q '"product_guide_click"' "${tmp_js}"
          grep -q 'enhanceAccessibility' "${tmp_js}"
          grep -q 'aria-current' "${tmp_js}"
          if grep -q 'initRealtimePanel' "${tmp_js}"; then
            echo "Realtime homepage logic must not remain in bousai_common.js."
            exit 1
          fi
          rm -f "${tmp_js}"

          tmp_css="$(mktemp)"
          curl --fail --silent --show-error --location \
            --retry 4 --retry-delay 5 --retry-all-errors \
            "${BASE_URL}bousai_common.css" -o "${tmp_css}"
          grep -q '\.skip-link' "${tmp_css}"
          grep -q 'prefers-reduced-motion' "${tmp_css}"
          if grep -q 'h2:nth-of-type(3n + 1) + p' "${tmp_css}"; then
            echo "Arbitrary periodic warning styling must not be present."
            exit 1
          fi
          rm -f "${tmp_css}"

          tmp_home_js="$(mktemp)"
          curl --fail --silent --show-error --location \
            --retry 4 --retry-delay 5 --retry-all-errors \
            "${BASE_URL}bousai_home.js" -o "${tmp_home_js}"
          grep -q 'initRealtimePanel' "${tmp_home_js}"
          grep -q '台風等' "${tmp_home_js}"
          grep -q 'bosai/quake/data/list.json' "${tmp_home_js}"
          grep -q 'bosai/warning/data/r8/map.json' "${tmp_home_js}"
          grep -q 'bosai/typhoon/data/targetTc.json' "${tmp_home_js}"
          rm -f "${tmp_home_js}"

          tmp_sitemap="$(mktemp)"
          curl --fail --silent --show-error --location \
            --retry 4 --retry-delay 5 --retry-all-errors \
            "${BASE_URL}sitemap.xml" -o "${tmp_sitemap}"
          grep -q "<urlset" "${tmp_sitemap}"
          grep -q "${BASE_URL}goods/portable-power-station-disaster.html" "${tmp_sitemap}"
          grep -q "${BASE_URL}water-outage/portable-toilet-stockpile.html" "${tmp_sitemap}"
          rm -f "${tmp_sitemap}"

          googlebot_status="$(curl --silent --show-error --location \
            --user-agent "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)" \
            --output /dev/null --write-out "%{http_code}" \
            "${BASE_URL}sitemap.xml")"
          echo "Googlebot sitemap HTTP status: ${googlebot_status}"
          test "${googlebot_status}" = "200"

          echo "Public smoke test passed."
