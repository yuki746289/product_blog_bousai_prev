# final sync; production CI performs full validation
name: One-off B042 B043 sync

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oneoff-b042-b043-sync.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync B042 B043 registry navigation and tests
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          articles = [
            {
              "affiliate": False,
              "article_id": "B042",
              "body_char_count_approx": 6700,
              "category": "flood",
              "content_depth_checked_at": "2026-09-05",
              "content_depth_status": "PASS",
              "content_role": "practical",
              "image_dedup_checked_at": "2026-09-05",
              "image_dedup_status": "PASS",
              "image_source_count": 0,
              "image_source_path": "docs/research/B042_IMAGES.md",
              "image_status": "APPROVED",
              "last_reviewed_at": "2026-09-05",
              "manual_review_required": True,
              "manual_review_status": "APPROVED",
              "next_review_at": "2027-03-05",
              "parent_article_id": "B005",
              "pickup_candidate": True,
              "planned_public_path": "flood/flood-river-evacuation.html",
              "preview_path": "preview/article_b042.html",
              "priority": "highest",
              "publish_blockers": [],
              "review_checklist_last_checked_at": "2026-09-05",
              "review_checklist_path": "docs/reviews/B042_CHECKLIST.md",
              "review_checklist_status": "PASS",
              "risk_level": "high",
              "slug": "flood-river-evacuation",
              "source_checked_at": "2026-09-05",
              "source_count": 5,
              "source_ids": ["F-B042-001","F-B042-002","F-B042-003","F-B042-004","F-B042-005"],
              "source_path": "content/articles/B042_flood_river_evacuation.md",
              "status": "READY_TO_PUBLISH",
              "title": "洪水キキクル・河川氾濫はいつ避難する？警戒レベルと河川情報の見方",
              "readability_review_status": "PASS",
              "readability_reviewed_at": "2026-09-05",
              "image_relevance_review_status": "PASS",
              "image_relevance_reviewed_at": "2026-09-05",
              "production_build_status": "READY_FOR_DEPLOY",
              "published_at": "2026-09-05",
              "modified_at": "2026-09-05"
            },
            {
              "affiliate": False,
              "article_id": "B043",
              "body_char_count_approx": 5900,
              "category": "typhoon",
              "content_depth_checked_at": "2026-09-05",
              "content_depth_status": "PASS",
              "content_role": "practical",
              "image_dedup_checked_at": "2026-09-05",
              "image_dedup_status": "PASS",
              "image_source_count": 0,
              "image_source_path": "docs/research/B043_IMAGES.md",
              "image_status": "APPROVED",
              "last_reviewed_at": "2026-09-05",
              "manual_review_required": True,
              "manual_review_status": "APPROVED",
              "next_review_at": "2027-03-05",
              "parent_article_id": "B006",
              "pickup_candidate": True,
              "planned_public_path": "typhoon/storm-surge-evacuation.html",
              "preview_path": "preview/article_b043.html",
              "priority": "highest",
              "publish_blockers": [],
              "review_checklist_last_checked_at": "2026-09-05",
              "review_checklist_path": "docs/reviews/B043_CHECKLIST.md",
              "review_checklist_status": "PASS",
              "risk_level": "high",
              "slug": "storm-surge-evacuation",
              "source_checked_at": "2026-09-05",
              "source_count": 5,
              "source_ids": ["F-B043-001","F-B043-002","F-B043-003","F-B043-004","F-B043-005"],
              "source_path": "content/articles/B043_storm_surge_evacuation.md",
              "status": "READY_TO_PUBLISH",
              "title": "高潮はいつ避難する？台風時の高潮・暴風と避難判断",
              "readability_review_status": "PASS",
              "readability_reviewed_at": "2026-09-05",
              "image_relevance_review_status": "PASS",
              "image_relevance_reviewed_at": "2026-09-05",
              "production_build_status": "READY_FOR_DEPLOY",
              "published_at": "2026-09-05",
              "modified_at": "2026-09-05"
            }
          ]

          registry_path = Path("data/content_registry.json")
          registry = json.loads(registry_path.read_text(encoding="utf-8"))
          existing = {a.get("article_id") for a in registry["articles"]}
          for article in articles:
              if article["article_id"] not in existing:
                  registry["articles"].append(article)
          registry["updated_at"] = "2026-09-05T10:20:00+09:00"
          registry_path.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          path = Path("preview/category_flood.html")
          text = path.read_text(encoding="utf-8")
          if 'data-article-id="B042"' not in text:
              marker = '<a class="category-article-link" href="article_b036.html" data-article-id="B036"><span>土砂災害はいつ避難する？土砂キキクルと避難判断の見方</span></a>'
              add = marker + '\n<a class="category-article-link" href="article_b042.html" data-article-id="B042"><span>洪水キキクル・河川氾濫はいつ避難する？警戒レベルと河川情報の見方</span></a>'
              if marker not in text: raise SystemExit("B042 category marker missing")
              path.write_text(text.replace(marker, add, 1), encoding="utf-8")

          path = Path("preview/category_typhoon.html")
          text = path.read_text(encoding="utf-8")
          if 'data-article-id="B043"' not in text:
              marker = '<a class="category-article-link" href="article_b021.html" data-article-id="B021"><span>台風前日に確認したいこと｜屋外・窓・停電への備え</span></a>'
              add = marker + '\n<a class="category-article-link" href="article_b043.html" data-article-id="B043"><span>高潮はいつ避難する？台風時の高潮・暴風と避難判断</span></a>'
              if marker not in text: raise SystemExit("B043 category marker missing")
              path.write_text(text.replace(marker, add, 1), encoding="utf-8")

          path = Path("content/articles/B005_flood_preparedness_basics.md")
          text = path.read_text(encoding="utf-8")
          if "article_b042.html" not in text:
              marker = "キキクルでは、大雨による災害の危険度を地図上で確認できます。自宅だけでなく、**これから通る避難経路の危険度も見る**と判断しやすくなります。"
              add = marker + "\n\n洪水キキクル・指定河川洪水予報を使った避難判断は、[洪水キキクル・河川氾濫はいつ避難する？](article_b042.html)で詳しく整理しています。"
              if marker not in text: raise SystemExit("B005 marker missing")
              path.write_text(text.replace(marker, add, 1), encoding="utf-8")

          path = Path("content/articles/B006_typhoon_preparation_checklist.md")
          text = path.read_text(encoding="utf-8")
          if "article_b043.html" not in text:
              marker = "2026年5月29日から防災気象情報の体系が見直されているため、SNSの古い画像や過去の記事ではなく、**現在の気象庁・自治体情報を優先**します。"
              add = marker + "\n\n沿岸部では、潮位上昇より先に暴風で移動できなくなる場合があります。高潮の避難タイミングは、[高潮はいつ避難する？台風時の高潮・暴風と避難判断](article_b043.html)で整理しています。"
              if marker not in text: raise SystemExit("B006 marker missing")
              path.write_text(text.replace(marker, add, 1), encoding="utf-8")

          path = Path("preview/article_b005.html")
          text = path.read_text(encoding="utf-8")
          if "article_b042.html" not in text:
              marker = '<p>気象庁の情報、自治体の避難情報、河川水位、道路情報を一つだけでなく組み合わせて確認します。</p>'
              add = marker + '<p>洪水キキクル・指定河川洪水予報を使った避難判断は、<a href="article_b042.html">洪水キキクル・河川氾濫はいつ避難する？</a>で詳しく整理しています。</p>'
              if marker not in text: raise SystemExit("B005 preview marker missing")
              path.write_text(text.replace(marker, add, 1), encoding="utf-8")

          path = Path("preview/article_b006.html")
          text = path.read_text(encoding="utf-8")
          if "article_b043.html" not in text:
              marker = '<p><strong>2026年からの現行防災気象情報を優先</strong>し、古い画像や投稿だけで判断しません。</p>'
              add = marker + '<p>沿岸部では潮位上昇より先に暴風で移動できなくなる場合があります。<a href="article_b043.html">高潮はいつ避難する？台風時の高潮・暴風と避難判断</a>で確認できます。</p>'
              if marker not in text: raise SystemExit("B006 preview marker missing")
              path.write_text(text.replace(marker, add, 1), encoding="utf-8")

          path = Path("tests/test_public_build.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace('self.assertEqual(41, len([a for a in articles if a.get("article_id", "").startswith("B")]))', 'self.assertEqual(43, len([a for a in articles if a.get("article_id", "").startswith("B")]))', 1)
          page_marker = '        self.assertTrue((PUBLIC / "earthquake" / "tsunami-evacuation.html").exists())'
          pages = '\n        self.assertTrue((PUBLIC / "flood" / "flood-river-evacuation.html").exists())\n        self.assertTrue((PUBLIC / "typhoon" / "storm-surge-evacuation.html").exists())'
          if 'flood-river-evacuation.html' not in text:
              if page_marker not in text: raise SystemExit("public page marker missing")
              text = text.replace(page_marker, page_marker + pages, 1)
          sitemap_marker = '        self.assertIn("https://bousaikun.ashigaru.jp/earthquake/tsunami-evacuation.html", sitemap)'
          sitemap_add = '\n        self.assertIn("https://bousaikun.ashigaru.jp/flood/flood-river-evacuation.html", sitemap)\n        self.assertIn("https://bousaikun.ashigaru.jp/typhoon/storm-surge-evacuation.html", sitemap)'
          if 'https://bousaikun.ashigaru.jp/flood/flood-river-evacuation.html' not in text:
              if sitemap_marker not in text: raise SystemExit("sitemap marker missing")
              text = text.replace(sitemap_marker, sitemap_marker + sitemap_add, 1)
          path.write_text(text, encoding="utf-8")

          path = Path("docs/research/SITEWIDE_CONTENT_GAP_REVIEW_20260905.md")
          text = path.read_text(encoding="utf-8")
          if "## B042・B043採用" not in text:
              text += "\n\n## B042・B043採用\n\n- B042 `洪水キキクル・河川氾濫はいつ避難する？警戒レベルと河川情報の見方` を公開対象化。\n- B043 `高潮はいつ避難する？台風時の高潮・暴風と避難判断` を公開対象化。\n- いずれも2026年5月29日の新防災気象情報体系を反映し、ラッコキーワード結果を待たず制度更新・安全性・既存空白を理由に優先した。\n- B044以降の順序はラッコキーワード等の需要データで補正する。\n"
              path.write_text(text, encoding="utf-8")
          PY

      - name: Commit sync
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/content_registry.json preview/category_flood.html preview/category_typhoon.html content/articles/B005_flood_preparedness_basics.md content/articles/B006_typhoon_preparation_checklist.md preview/article_b005.html preview/article_b006.html tests/test_public_build.py docs/research/SITEWIDE_CONTENT_GAP_REVIEW_20260905.md
          git commit -m "Register B042 B043 and add evacuation navigation"
          git push origin HEAD:main
