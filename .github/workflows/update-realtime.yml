name: Update realtime disaster data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/update_realtime.py"
      - "preview/realtime/realtime.json"
      - ".github/workflows/update-realtime.yml"
  schedule:
    - cron: "*/10 * * * *"

concurrency:
  group: realtime-disaster-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-slim
    timeout-minutes: 3
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch previous realtime state
        run: |
          mkdir -p .cache realtime_upload
          BASE_URL="$(python3 - <<'PY'
          import json
          with open("config/site.json", encoding="utf-8") as f:
              print(json.load(f)["public_base_url"].rstrip("/") + "/")
          PY
          )"
          if ! curl --fail --silent --show-error --location             --connect-timeout 10 --max-time 20             "${BASE_URL}realtime/realtime.json?ts=$(date +%s)"             -o .cache/realtime.json; then
            cp preview/realtime/realtime.json .cache/realtime.json
          fi

      - name: Fetch JMA XML and build JSON
        run: |
          python3 scripts/update_realtime.py             --previous .cache/realtime.json             --output realtime_upload/realtime.json

      - name: Validate realtime JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("realtime_upload/realtime.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          assert data["schema_version"] == "1.0"
          assert data["status"] in {"ok", "partial", "degraded"}
          assert "warnings" in data
          assert "typhoons" in data
          assert "earthquake" in data
          assert data.get("checked_at")
          print({
              "status": data["status"],
              "checked_at": data["checked_at"],
              "warning_count": data["warnings"]["active_count"],
              "typhoon_count": len(data["typhoons"]),
              "has_earthquake": bool(data["earthquake"]),
          })
          PY

      - name: Upload realtime JSON
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ftp.homepage.shinobi.jp
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./realtime_upload/
          server-dir: ./realtime/
          state-name: .ftp-deploy-sync-state-realtime.json
          dangerous-clean-slate: false
          log-level: minimal
          security: strict
          timeout: 60000

      - name: Smoke test realtime JSON
        run: |
          BASE_URL="$(python3 - <<'PY'
          import json
          with open("config/site.json", encoding="utf-8") as f:
              print(json.load(f)["public_base_url"].rstrip("/") + "/")
          PY
          )"
          tmp="$(mktemp)"
          curl --fail --silent --show-error --location             --retry 3 --retry-delay 4 --retry-all-errors             "${BASE_URL}realtime/realtime.json?ts=$(date +%s)" -o "${tmp}"
          grep -q '"schema_version": "1.0"' "${tmp}"
          grep -q '"checked_at":' "${tmp}"
          rm -f "${tmp}"
