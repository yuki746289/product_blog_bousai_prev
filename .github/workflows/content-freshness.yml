name: Content freshness check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "content/**"
      - "data/content_registry.json"
      - "config/site.json"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/content-freshness.yml"
  schedule:
    - cron: "0 21 * * 0"

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check content registry
        run: bousai-blog-freshness data/content_registry.json
