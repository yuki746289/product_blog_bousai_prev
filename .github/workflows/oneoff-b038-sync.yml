name: One-off B038 sync

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oneoff-b038-sync.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync B038 registry and navigation
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          article = {
              "affiliate": False,
              "article_id": "B038",
              "body_char_count_approx": 6100,
              "category": "earthquake",
              "content_depth_checked_at": "2026-09-04",
              "content_depth_status": "PASS",
              "content_role": "practical",
              "image_dedup_checked_at": "2026-09-04",
              "image_dedup_status": "PASS",
              "image_source_count": 1,
              "image_source_path": "docs/research/B038_IMAGES.md",
              "image_status": "APPROVED",
              "last_reviewed_at": "2026-09-04",
              "manual_review_required": True,
              "manual_review_status": "APPROVED",
              "next_review_at": "2027-03-04",
              "parent_article_id": "B007",
              "pickup_candidate": True,
              "planned_public_path": "earthquake/earthquake-stranded-commuter.html",
              "preview_path": "preview/article_b038.html",
              "priority": "high",
              "publish_blockers": [],
              "review_checklist_last_checked_at": "2026-09-04",
              "review_checklist_path": "docs/reviews/B038_CHECKLIST.md",
              "review_checklist_status": "PASS",
              "risk_level": "elevated",
              "slug": "earthquake-stranded-commuter",
              "source_checked_at": "2026-09-04",
              "source_count": 4,
              "source_ids": ["F-B038-001", "F-B038-002", "F-B038-003", "F-B038-004"],
              "source_path": "content/articles/B038_earthquake_stranded_commuter.md",
              "status": "READY_TO_PUBLISH",
              "title": "大地震で電車が止まったら帰宅する？帰宅困難者がまず取る行動と備え",
              "readability_review_status": "PASS",
              "readability_reviewed_at": "2026-09-04",
              "image_relevance_review_status": "PASS",
              "image_relevance_reviewed_at": "2026-09-04",
              "production_build_status": "READY_FOR_DEPLOY",
              "published_at": "2026-09-04",
              "modified_at": "2026-09-04"
          }

          registry_path = Path("data/content_registry.json")
          registry = json.loads(registry_path.read_text(encoding="utf-8"))
          if not any(a.get("article_id") == "B038" for a in registry["articles"]):
              registry["articles"].append(article)
              registry_path.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          category_path = Path("preview/category_earthquake.html")
          category = category_path.read_text(encoding="utf-8")
          if 'data-article-id="B038"' not in category:
              block = '''<section class="category-section">
    <div class="section-heading"><div><h2>外出先で被災したとき</h2><p>電車やバスが止まり、自宅へ戻れない場合の行動です。</p></div></div>
    <div class="category-article-list"><a class="category-article-link" href="article_b038.html" data-article-id="B038"><span>大地震で電車が止まったら帰宅する？帰宅困難者がまず取る行動と備え</span></a></div>
  </section>
'''
              marker = '<section class="category-section">\n    <div class="section-heading"><div><h2>保険を確認する</h2>'
              if marker not in category:
                  raise SystemExit("B038 category insertion marker not found")
              category = category.replace(marker, block + marker, 1)
              category_path.write_text(category, encoding="utf-8")

          md_path = Path("content/articles/B007_earthquake_preparedness_basics.md")
          md = md_path.read_text(encoding="utf-8")
          if "article_b038.html" not in md:
              heading = "## 外出先で地震に遭うケースも家族ルールに入れる\n"
              note = "\n具体的な待機場所、一時滞在施設、72時間の考え方、分散帰宅は、[大地震で電車が止まったら帰宅する？](article_b038.html)で整理しています。\n"
              if heading not in md:
                  raise SystemExit("B007 markdown insertion heading not found")
              md = md.replace(heading, heading + note, 1)
              md_path.write_text(md, encoding="utf-8")

          preview_path = Path("preview/article_b007.html")
          preview = preview_path.read_text(encoding="utf-8")
          if "article_b038.html" not in preview:
              pattern = r'(<h2>外出先で地震に遭うケースも家族ルールに入れる</h2>)'
              replacement = r'\1\n<p>具体的な待機場所、一時滞在施設、72時間の考え方、分散帰宅は、<a href="article_b038.html">大地震で電車が止まったら帰宅する？</a>で整理しています。</p>'
              preview, n = re.subn(pattern, replacement, preview, count=1)
              if n != 1:
                  raise SystemExit("B007 preview insertion heading not found")
              preview_path.write_text(preview, encoding="utf-8")
          PY

      - name: Commit sync
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/content_registry.json preview/category_earthquake.html content/articles/B007_earthquake_preparedness_basics.md preview/article_b007.html
          git commit -m "Register B038 and add earthquake navigation"
          git push origin HEAD:main
