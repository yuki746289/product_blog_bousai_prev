name: One-off non-article review fixes

on:
  push:
    paths:
      - '.github/workflows/oneoff-non-article-review-fixes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply fixes
        run: python .github/tmp/patch_non_article_review.py
      - name: Verify JavaScript
        run: node --check preview/bousai_home.js
      - name: Run tests
        run: |
          pip install -e .
          python -m unittest discover -s tests -v
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preview/bousai_home.js preview/about.html preview/privacy.html preview/qa.html
          git commit -m 'Fix non-article safety and transparency issues'
          git push
