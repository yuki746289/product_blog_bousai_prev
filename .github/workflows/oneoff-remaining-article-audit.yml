name: One-off remaining article audit

on:
  push:
    paths:
      - '.github/workflows/oneoff-remaining-article-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Normalize B028 markers in helper
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/tmp/oneoff_remaining_article_audit.py')
          t = p.read_text(encoding='utf-8')
          t = t.replace(
              "source_marker = '- 消費者庁「2026年度 公表資料」: https://www.caa.go.jp/policies/policy/consumer_safety/release/2026/'",
              "source_marker = '- 消費者庁「2026年度 重大製品事故等の公表資料」: https://www.caa.go.jp/policies/policy/consumer_safety/release/2026/'"
          )
          t = t.replace(
              "plain_marker = '購入時と定期点検時に、<strong>型番を経済産業省・メーカーのリコール情報で照合</strong>します。'",
              "plain_marker = 'ポータブル電源はリチウムイオン電池を含む電気製品です。異常・リコール情報はメーカーと公的情報を確認してください。'"
          )
          t = t.replace(
              "plain_add = '<p>NITE（製品評価技術基盤機構）も、リコール対象のポータブル電源は、異常が見られなくても使用を中止し、事業者の案内に従うよう注意喚起しています。<strong>「今まで問題なく使えた」ことを安全確認の代わりにしません。</strong></p>'",
              "plain_add = ' リコール対象品は異常が見られなくても使用を中止し、事業者の案内に従ってください。'"
          )
          p.write_text(t, encoding='utf-8')

          preview = Path('preview/article_b028.html')
          h = preview.read_text(encoding='utf-8')
          nite_url = 'https://www.nite.go.jp/jiko/chuikanki/press/2024fy/prs240627.html'
          if nite_url not in h:
              block = '<p class="source-note">追加の公的安全情報：<a href="' + nite_url + '" target="_blank" rel="noopener noreferrer">NITE「リコール対象のポータブル電源に関する注意喚起」</a></p>'
              assert '</article>' in h
              h = h.replace('</article>', block + '</article>', 1)
              preview.write_text(h, encoding='utf-8')
          PY
      - name: Apply remaining article audit
        run: python .github/tmp/oneoff_remaining_article_audit.py
      - name: Normalize product checklist table cells
        run: |
          python - <<'PY'
          from pathlib import Path
          for aid in ('B026','B027','B028','B029'):
              p = Path(f'docs/reviews/{aid}_CHECKLIST.md')
              t = p.read_text(encoding='utf-8')
              t = t.replace(
                  '| E09 商品/アフィリエイト | REQUIRED | PASS | 商品・Amazon導線を本文の判断材料の後に置き、現行商品・ASIN・価格表現を再確認。商品画像のアカウント/提供元固有の利用条件は U09 で追跡 |',
                  '| E09 商品/アフィリエイト | REQUIRED | PASS。商品・Amazon導線を本文の判断材料の後に置き、現行商品・ASIN・価格表現を再確認。商品画像のアカウント/提供元固有の利用条件は U09 で追跡 |'
              )
              t = t.replace(
                  '| E12 セキュリティ/法務/権利/プライバシー | REQUIRED | PASS_WITH_FOLLOW_UP | 著作権・広告表示・外部リンクを確認。商品画像の提供元固有条件は U09 に残し、確認済みと偽装しない |',
                  '| E12 セキュリティ/法務/権利/プライバシー | REQUIRED | PASS_WITH_FOLLOW_UP。著作権・広告表示・外部リンクを確認。商品画像の提供元固有条件は U09 に残し、確認済みと偽装しない |'
              )
              p.write_text(t, encoding='utf-8')
          PY
      - name: Install package
        run: pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Commit synchronized audit
        run: |
          if git diff --quiet; then
            echo "No audit changes to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/articles docs/research docs/reviews docs/USER_ACTION_ITEMS.md preview data/content_registry.json
          git commit -m 'Normalize remaining expert review records'
          git push
