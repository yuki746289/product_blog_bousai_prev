name: One-off home and flood audit

on:
  push:
    paths:
      - '.github/workflows/oneoff-home-flood-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply audit
        run: python .github/tmp/oneoff_home_flood_audit.py
      - name: Install package
        run: pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Commit synchronized audit
        run: |
          if git diff --quiet; then
            echo "No audit changes to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/articles docs/research docs/reviews preview data/content_registry.json
          git commit -m 'Finalize home and flood expert audit'
          git push
