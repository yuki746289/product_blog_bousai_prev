# Created: 2026-09-04
name: One-off insurance detail audit sync

on:
  push:
    paths:
      - '.github/workflows/oneoff-insurance-detail-audit-sync.yml'
      - '.github/scripts/oneoff_insurance_detail_audit.py'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply insurance detail expert audit
        run: python .github/scripts/oneoff_insurance_detail_audit.py
      - name: Preserve registry timestamp monotonicity
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          path = Path('data/content_registry.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          prior_max = '2026-09-04T14:35:00+09:00'
          if data.get('updated_at', '') < prior_max:
              data['updated_at'] = prior_max
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Install package
        run: pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Commit synchronized audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/articles/B011_flooded_car_insurance.md content/articles/B013_fire_insurance_water_damage.md content/articles/B014_household_goods_flood_insurance.md content/articles/B016_typhoon_wind_damage_insurance.md docs/research/B011_SOURCES.md docs/research/B013_SOURCES.md docs/research/B014_SOURCES.md docs/research/B016_SOURCES.md docs/reviews/B011_CHECKLIST.md docs/reviews/B013_CHECKLIST.md docs/reviews/B014_CHECKLIST.md docs/reviews/B016_CHECKLIST.md preview/article_b011.html preview/article_b013.html preview/article_b014.html preview/article_b016.html data/content_registry.json
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Restore registry audit timestamp'
          git push
