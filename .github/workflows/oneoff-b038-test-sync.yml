name: One-off B038 test sync

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/oneoff-b038-test-sync.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update B038 regression expectations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/test_public_build.py")
          text = path.read_text(encoding="utf-8")
          old_count = 'self.assertEqual(37, len([a for a in articles if a.get("article_id", "").startswith("B")]))'
          new_count = 'self.assertEqual(38, len([a for a in articles if a.get("article_id", "").startswith("B")]))'
          if old_count in text:
              text = text.replace(old_count, new_count, 1)
          elif new_count not in text:
              raise SystemExit("article count assertion not found")

          old_page = '        self.assertTrue((PUBLIC / "post-disaster" / "flood-cleanup-dry-disinfect.html").exists())'
          new_page = old_page + '\n        self.assertTrue((PUBLIC / "earthquake" / "earthquake-stranded-commuter.html").exists())'
          if 'earthquake-stranded-commuter.html").exists()' not in text:
              if old_page not in text:
                  raise SystemExit("expected-page insertion marker not found")
              text = text.replace(old_page, new_page, 1)

          old_sitemap = '        self.assertIn("https://bousaikun.ashigaru.jp/post-disaster/flood-cleanup-dry-disinfect.html", sitemap)'
          new_sitemap = old_sitemap + '\n        self.assertIn("https://bousaikun.ashigaru.jp/earthquake/earthquake-stranded-commuter.html", sitemap)'
          if 'earthquake/earthquake-stranded-commuter.html", sitemap)' not in text:
              if old_sitemap not in text:
                  raise SystemExit("sitemap insertion marker not found")
              text = text.replace(old_sitemap, new_sitemap, 1)

          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit test sync
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_public_build.py
          git commit -m "Update public build tests for B038"
          git push origin HEAD:main
