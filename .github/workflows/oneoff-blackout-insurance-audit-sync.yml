# Created: 2026-09-04
name: One-off blackout and insurance audit sync

on:
  push:
    paths:
      - '.github/workflows/oneoff-blackout-insurance-audit-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Sync B004 preview audit data
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('preview/article_b004.html')
          text = path.read_text(encoding='utf-8')
          text = text.replace('公的情報確認: 2026年9月1日', '公的情報確認: 2026年9月4日')
          old = '<li><a href="https://www.bousai.go.jp/kyoiku/hokenkyousai/check.html" target="_blank" rel="noopener noreferrer">内閣府「自然災害への備えは万全ですか？」</a></li></ul></section>'
          new = '<li><a href="https://www.bousai.go.jp/kyoiku/hokenkyousai/check.html" target="_blank" rel="noopener noreferrer">内閣府「自然災害への備えは万全ですか？」</a></li><li><a href="https://www.caa.go.jp/policies/policy/consumer_safety/caution/caution_078/" target="_blank" rel="noopener noreferrer">消費者庁「携帯発電機・ポータブル電源の事故と通電火災に注意」</a></li></ul></section>'
          if old not in text:
              raise SystemExit('B004 source list anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Install package
        run: pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Commit preview synchronization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preview/article_b004.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Sync B004 preview audit sources'
          git push
