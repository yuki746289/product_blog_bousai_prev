# Created: 2026-09-04
name: One-off blackout and insurance audit sync

on:
  push:
    paths:
      - '.github/workflows/oneoff-blackout-insurance-audit-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Sync audited article metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          path = Path('data/content_registry.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          by_id = {a['article_id']: a for a in data['articles']}

          by_id['B004'].update({
              'source_checked_at': '2026-09-04',
              'source_count': 4,
              'source_ids': [f'F-B004-{i:03d}' for i in range(1, 5)],
              'last_reviewed_at': '2026-09-04',
          })
          by_id['B019'].update({
              'source_checked_at': '2026-09-04',
              'last_reviewed_at': '2026-09-04',
          })
          data['updated_at'] = '2026-09-04T14:30:00+09:00'
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Install package
        run: pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Commit synchronized metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/content_registry.json
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Sync blackout and insurance audit metadata'
          git push
