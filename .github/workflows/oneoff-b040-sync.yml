name: One-off B040 sync

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/oneoff-b040-sync.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync B040 registry navigation and tests
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          article = {
              "affiliate": False,
              "article_id": "B040",
              "body_char_count_approx": 6700,
              "category": "earthquake",
              "content_depth_checked_at": "2026-09-04",
              "content_depth_status": "PASS",
              "content_role": "detail",
              "image_dedup_checked_at": "2026-09-04",
              "image_dedup_status": "PASS",
              "image_source_count": 0,
              "image_source_path": "docs/research/B040_IMAGES.md",
              "image_status": "APPROVED",
              "last_reviewed_at": "2026-09-04",
              "manual_review_required": True,
              "manual_review_status": "APPROVED",
              "next_review_at": "2027-03-04",
              "parent_article_id": "B007",
              "pickup_candidate": True,
              "planned_public_path": "earthquake/earthquake-sensitive-breaker.html",
              "preview_path": "preview/article_b040.html",
              "priority": "high",
              "publish_blockers": [],
              "review_checklist_last_checked_at": "2026-09-04",
              "review_checklist_path": "docs/reviews/B040_CHECKLIST.md",
              "review_checklist_status": "PASS",
              "risk_level": "elevated",
              "slug": "earthquake-sensitive-breaker",
              "source_checked_at": "2026-09-04",
              "source_count": 7,
              "source_ids": ["F-B040-001", "F-B040-002", "F-B040-003", "F-B040-004", "F-B040-005", "F-B040-006", "F-B040-007"],
              "source_path": "content/articles/B040_earthquake_sensitive_breaker.md",
              "status": "READY_TO_PUBLISH",
              "title": "感震ブレーカーとは？地震の電気火災・通電火災を防ぐ選び方と注意点",
              "readability_review_status": "PASS",
              "readability_reviewed_at": "2026-09-04",
              "image_relevance_review_status": "PASS",
              "image_relevance_reviewed_at": "2026-09-04",
              "production_build_status": "READY_FOR_DEPLOY",
              "published_at": "2026-09-04",
              "modified_at": "2026-09-04"
          }

          registry_path = Path("data/content_registry.json")
          registry = json.loads(registry_path.read_text(encoding="utf-8"))
          if not any(a.get("article_id") == "B040" for a in registry["articles"]):
              registry["articles"].append(article)
          registry["updated_at"] = max(registry.get("updated_at", ""), "2026-09-04T22:30:00+09:00")
          registry_path.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          category_path = Path("preview/category_earthquake.html")
          category = category_path.read_text(encoding="utf-8")
          if 'data-article-id="B040"' not in category:
              old = '<div class="category-article-list"><a class="category-article-link" href="article_b023.html" data-article-id="B023"><span>地震の家具転倒対策｜まず優先したい場所</span></a></div>'
              new = '<div class="category-article-list"><a class="category-article-link" href="article_b023.html" data-article-id="B023"><span>地震の家具転倒対策｜まず優先したい場所</span></a>\n<a class="category-article-link" href="article_b040.html" data-article-id="B040"><span>感震ブレーカーとは？地震の電気火災・通電火災を防ぐ選び方と注意点</span></a></div>'
              if old not in category:
                  raise SystemExit("B040 category marker not found")
              category = category.replace(old, new, 1)
              category = category.replace('被害を減らすための具体的な準備です。', '家具転倒と電気火災を減らすための具体的な準備です。', 1)
              category_path.write_text(category, encoding="utf-8")

          b007_path = Path("content/articles/B007_earthquake_preparedness_basics.md")
          b007 = b007_path.read_text(encoding="utf-8")
          if "article_b040.html" not in b007:
              marker = "内閣府は地震時の電気火災対策として感震ブレーカーの設置を促しています。設置する場合は、急な停電でも困らない照明や医療機器のバックアップも合わせて考えます。"
              addition = marker + "\n\n種類ごとの違い、夜間照明・医療機器・復電時の注意は、[感震ブレーカーとは？地震の電気火災・通電火災を防ぐ選び方と注意点](article_b040.html)で詳しく整理しています。"
              if marker not in b007:
                  raise SystemExit("B007 B040 insertion marker not found")
              b007 = b007.replace(marker, addition, 1)
              b007_path.write_text(b007, encoding="utf-8")

          b007_preview_path = Path("preview/article_b007.html")
          b007_preview = b007_preview_path.read_text(encoding="utf-8")
          if "article_b040.html" not in b007_preview:
              marker = '<p>内閣府は地震時の電気火災対策として感震ブレーカーの設置を促しています。設置する場合は、急な停電でも困らない照明や医療機器のバックアップも合わせて考えます。</p>'
              addition = marker + '<p>種類ごとの違い、夜間照明・医療機器・復電時の注意は、<a href="article_b040.html">感震ブレーカーとは？地震の電気火災・通電火災を防ぐ選び方と注意点</a>で詳しく整理しています。</p>'
              if marker not in b007_preview:
                  raise SystemExit("B007 preview B040 marker not found")
              b007_preview = b007_preview.replace(marker, addition, 1)
              b007_preview_path.write_text(b007_preview, encoding="utf-8")

          b024_path = Path("content/articles/B024_earthquake_blackout_water_outage.md")
          b024 = b024_path.read_text(encoding="utf-8")
          if "article_b040.html" not in b024:
              marker = "## 復電時の火災を防ぐ\n"
              note = "\n感震ブレーカーの種類・設置時の停電影響・医療機器への配慮は、[感震ブレーカーとは？](article_b040.html)で詳しく整理しています。\n\n"
              if marker not in b024:
                  raise SystemExit("B024 B040 heading not found")
              b024 = b024.replace(marker, marker + note, 1)
              b024_path.write_text(b024, encoding="utf-8")

          b024_preview_path = Path("preview/article_b024.html")
          b024_preview = b024_preview_path.read_text(encoding="utf-8")
          if "article_b040.html" not in b024_preview:
              marker = "<h2>復電時の火災を防ぐ</h2>"
              note = '<p>感震ブレーカーの種類・設置時の停電影響・医療機器への配慮は、<a href="article_b040.html">感震ブレーカーとは？</a>で詳しく整理しています。</p>'
              if marker not in b024_preview:
                  raise SystemExit("B024 preview B040 heading not found")
              b024_preview = b024_preview.replace(marker, marker + note, 1)
              b024_preview_path.write_text(b024_preview, encoding="utf-8")

          test_path = Path("tests/test_public_build.py")
          test = test_path.read_text(encoding="utf-8")
          old_count = 'self.assertEqual(39, len([a for a in articles if a.get("article_id", "").startswith("B")]))'
          new_count = 'self.assertEqual(40, len([a for a in articles if a.get("article_id", "").startswith("B")]))'
          if old_count in test:
              test = test.replace(old_count, new_count, 1)
          elif new_count not in test:
              raise SystemExit("B040 article count assertion not found")

          page_marker = '        self.assertTrue((PUBLIC / "earthquake" / "earthquake-stay-home-or-shelter.html").exists())'
          page_b040 = '        self.assertTrue((PUBLIC / "earthquake" / "earthquake-sensitive-breaker.html").exists())'
          if page_b040 not in test:
              if page_marker not in test:
                  raise SystemExit("B040 public page marker not found")
              test = test.replace(page_marker, page_marker + "\n" + page_b040, 1)

          sitemap_marker = '        self.assertIn("https://bousaikun.ashigaru.jp/earthquake/earthquake-stay-home-or-shelter.html", sitemap)'
          sitemap_b040 = '        self.assertIn("https://bousaikun.ashigaru.jp/earthquake/earthquake-sensitive-breaker.html", sitemap)'
          if sitemap_b040 not in test:
              if sitemap_marker not in test:
                  raise SystemExit("B040 sitemap marker not found")
              test = test.replace(sitemap_marker, sitemap_marker + "\n" + sitemap_b040, 1)
          test_path.write_text(test, encoding="utf-8")

          gap_path = Path("docs/research/EARTHQUAKE_CONTENT_GAP_REVIEW_20260904.md")
          gap = gap_path.read_text(encoding="utf-8")
          if "## B040採用" not in gap:
              gap += "\n\n## B040採用\n\n- title: `感震ブレーカーとは？地震の電気火災・通電火災を防ぐ選び方と注意点`\n- slug: `earthquake-sensitive-breaker`\n- category: `earthquake`\n- content_role: `detail`\n- parent: `B007`\n- risk_level: `elevated`\n\nB039公開後、次点だった電気火災テーマを採用。B007/B024では短い注意に留まっていたため、2026年3月の内閣府選び方資料、2026年8月の消費者庁注意喚起を反映し、種類・施工・夜間照明・医療機器・避難・復電を独立して整理する。\n"
              gap_path.write_text(gap, encoding="utf-8")
          PY

      - name: Run tests before commit
        run: |
          pip install -e .
          python -m unittest discover -s tests -v

      - name: Commit sync
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/content_registry.json preview/category_earthquake.html content/articles/B007_earthquake_preparedness_basics.md preview/article_b007.html content/articles/B024_earthquake_blackout_water_outage.md preview/article_b024.html tests/test_public_build.py docs/research/EARTHQUAKE_CONTENT_GAP_REVIEW_20260904.md
          git commit -m "Register B040 and add earthquake fire navigation"
          git push origin HEAD:main
