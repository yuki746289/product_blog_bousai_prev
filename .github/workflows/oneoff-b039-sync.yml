name: One-off B039 sync

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/oneoff-b039-sync.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync B039 registry navigation and tests
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          article = {
              "affiliate": False,
              "article_id": "B039",
              "body_char_count_approx": 6200,
              "category": "earthquake",
              "content_depth_checked_at": "2026-09-04",
              "content_depth_status": "PASS",
              "content_role": "practical",
              "image_dedup_checked_at": "2026-09-04",
              "image_dedup_status": "PASS",
              "image_source_count": 1,
              "image_source_path": "docs/research/B039_IMAGES.md",
              "image_status": "APPROVED",
              "last_reviewed_at": "2026-09-04",
              "manual_review_required": True,
              "manual_review_status": "APPROVED",
              "next_review_at": "2027-03-04",
              "parent_article_id": "B007",
              "pickup_candidate": True,
              "planned_public_path": "earthquake/earthquake-stay-home-or-shelter.html",
              "preview_path": "preview/article_b039.html",
              "priority": "high",
              "publish_blockers": [],
              "review_checklist_last_checked_at": "2026-09-04",
              "review_checklist_path": "docs/reviews/B039_CHECKLIST.md",
              "review_checklist_status": "PASS",
              "risk_level": "high",
              "slug": "earthquake-stay-home-or-shelter",
              "source_checked_at": "2026-09-04",
              "source_count": 6,
              "source_ids": ["F-B039-001", "F-B039-002", "F-B039-003", "F-B039-004", "F-B039-005", "F-B039-006"],
              "source_path": "content/articles/B039_earthquake_stay_home_or_shelter.md",
              "status": "READY_TO_PUBLISH",
              "title": "地震後、自宅に残る？避難所へ行く？在宅避難と避難所の判断基準",
              "readability_review_status": "PASS",
              "readability_reviewed_at": "2026-09-04",
              "image_relevance_review_status": "PASS",
              "image_relevance_reviewed_at": "2026-09-04",
              "production_build_status": "READY_FOR_DEPLOY",
              "published_at": "2026-09-04",
              "modified_at": "2026-09-04"
          }

          registry_path = Path("data/content_registry.json")
          registry = json.loads(registry_path.read_text(encoding="utf-8"))
          if not any(a.get("article_id") == "B039" for a in registry["articles"]):
              registry["articles"].append(article)
              registry_path.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          category_path = Path("preview/category_earthquake.html")
          category = category_path.read_text(encoding="utf-8")
          if 'data-article-id="B039"' not in category:
              old = '<div class="category-article-list"><a class="category-article-link" href="article_b024.html" data-article-id="B024"><span>地震後の停電・断水にどう備える？</span></a></div>'
              new = '<div class="category-article-list"><a class="category-article-link" href="article_b024.html" data-article-id="B024"><span>地震後の停電・断水にどう備える？</span></a>\n<a class="category-article-link" href="article_b039.html" data-article-id="B039"><span>地震後、自宅に残る？避難所へ行く？在宅避難と避難所の判断基準</span></a></div>'
              if old not in category:
                  raise SystemExit("B039 category marker not found")
              category = category.replace(old, new, 1)
              category = category.replace('停電・断水などライフライン停止への備えです。', '停電・断水への備えと、自宅・避難所での生活場所判断です。', 1)
              category = category.replace('家具の転倒、停電・断水、外出先での帰宅困難、地震保険など、地震に関する防災記事をまとめています。家庭内だけでなく通勤・通学中の行動も確認できます。', '家具の転倒、停電・断水、在宅避難、外出先での帰宅困難、地震保険など、地震に関する防災記事をまとめています。家庭内外の発災後行動も確認できます。', 1)
              category = category.replace('家具の転倒、停電・断水、外出先での帰宅困難、保険まで、地震への備えと発災後の行動を家庭目線で整理します。', '家具の転倒、停電・断水、在宅避難、外出先での帰宅困難、保険まで、地震への備えと発災後の行動を家庭目線で整理します。', 1)
              category_path.write_text(category, encoding="utf-8")

          b007_path = Path("content/articles/B007_earthquake_preparedness_basics.md")
          b007 = b007_path.read_text(encoding="utf-8")
          if "article_b039.html" not in b007:
              marker = "自宅が安全でライフライン対策ができる場合、在宅避難が適するケースもあります。一方、建物に危険があるのに備蓄があるから残る、という判断は避けます。"
              addition = marker + "\n\n自宅に残るか避難所へ行くかの具体的な判断は、[地震後、自宅に残る？避難所へ行く？](article_b039.html)で整理しています。"
              if marker not in b007:
                  raise SystemExit("B007 B039 insertion marker not found")
              b007 = b007.replace(marker, addition, 1)
              rel = "- [地震後の停電・断水](article_b024.html)"
              if rel in b007 and "在宅避難と避難所" not in b007:
                  b007 = b007.replace(rel, rel + "\n- [在宅避難と避難所の判断](article_b039.html)", 1)
              b007_path.write_text(b007, encoding="utf-8")

          b007_preview_path = Path("preview/article_b007.html")
          b007_preview = b007_preview_path.read_text(encoding="utf-8")
          if "article_b039.html" not in b007_preview:
              heading = "<h2>避難先は1か所だけ覚えない</h2>"
              paragraph = '<p>自宅に残るか避難所へ行くかの具体的な判断は、<a href="article_b039.html">地震後、自宅に残る？避難所へ行く？</a>で整理しています。</p>'
              if heading not in b007_preview:
                  raise SystemExit("B007 preview heading not found")
              b007_preview = b007_preview.replace(heading, heading + paragraph, 1)
              b007_preview_path.write_text(b007_preview, encoding="utf-8")

          b024_path = Path("content/articles/B024_earthquake_blackout_water_outage.md")
          b024 = b024_path.read_text(encoding="utf-8")
          if "article_b039.html" not in b024:
              heading = "## 在宅避難を続けられるか毎日判断する\n"
              note = "\n自宅に残る条件と避難所へ切り替える判断は、[地震後、自宅に残る？避難所へ行く？](article_b039.html)で整理しています。\n"
              if heading not in b024:
                  raise SystemExit("B024 markdown heading not found")
              b024 = b024.replace(heading, heading + note, 1)
              b024_path.write_text(b024, encoding="utf-8")

          b024_preview_path = Path("preview/article_b024.html")
          b024_preview = b024_preview_path.read_text(encoding="utf-8")
          if "article_b039.html" not in b024_preview:
              heading = "<h2>在宅避難を続けられるか毎日判断する</h2>"
              note = '<p>自宅に残る条件と避難所へ切り替える判断は、<a href="article_b039.html">地震後、自宅に残る？避難所へ行く？</a>で整理しています。</p>'
              if heading not in b024_preview:
                  raise SystemExit("B024 preview heading not found")
              b024_preview = b024_preview.replace(heading, heading + note, 1)
              b024_preview_path.write_text(b024_preview, encoding="utf-8")

          test_path = Path("tests/test_public_build.py")
          test = test_path.read_text(encoding="utf-8")
          old_count = 'self.assertEqual(38, len([a for a in articles if a.get("article_id", "").startswith("B")]))'
          new_count = 'self.assertEqual(39, len([a for a in articles if a.get("article_id", "").startswith("B")]))'
          if old_count in test:
              test = test.replace(old_count, new_count, 1)
          elif new_count not in test:
              raise SystemExit("B039 article count assertion not found")

          page_line = '        self.assertTrue((PUBLIC / "earthquake" / "earthquake-stranded-commuter.html").exists())'
          b039_page = '        self.assertTrue((PUBLIC / "earthquake" / "earthquake-stay-home-or-shelter.html").exists())'
          if b039_page not in test:
              if page_line not in test:
                  raise SystemExit("B039 expected page marker not found")
              test = test.replace(page_line, page_line + "\n" + b039_page, 1)

          sitemap_line = '        self.assertIn("https://bousaikun.ashigaru.jp/earthquake/earthquake-stranded-commuter.html", sitemap)'
          b039_sitemap = '        self.assertIn("https://bousaikun.ashigaru.jp/earthquake/earthquake-stay-home-or-shelter.html", sitemap)'
          if b039_sitemap not in test:
              if sitemap_line not in test:
                  raise SystemExit("B039 sitemap marker not found")
              test = test.replace(sitemap_line, sitemap_line + "\n" + b039_sitemap, 1)
          test_path.write_text(test, encoding="utf-8")

          gap_path = Path("docs/research/EARTHQUAKE_CONTENT_GAP_REVIEW_20260904.md")
          gap = gap_path.read_text(encoding="utf-8")
          if "## B039採用" not in gap:
              gap += "\n\n## B039採用\n\n- title: `地震後、自宅に残る？避難所へ行く？在宅避難と避難所の判断基準`\n- slug: `earthquake-stay-home-or-shelter`\n- category: `earthquake`\n- content_role: `practical`\n- parent: `B007`\n- risk_level: `high`\n\nB038公開後に地震クラスターを再確認し、既存B007/B024では断片的だった「指定緊急避難場所・指定避難所・在宅避難の選択」を独立検索意図として採用した。建物安全を当サイトだけで断定せず、緊急危険時は避難を優先し、在宅避難中も毎日再判断する設計とする。\n"
              gap_path.write_text(gap, encoding="utf-8")
          PY

      - name: Commit sync
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/content_registry.json preview/category_earthquake.html content/articles/B007_earthquake_preparedness_basics.md preview/article_b007.html content/articles/B024_earthquake_blackout_water_outage.md preview/article_b024.html tests/test_public_build.py docs/research/EARTHQUAKE_CONTENT_GAP_REVIEW_20260904.md
          git commit -m "Register B039 and add earthquake navigation"
          git push origin HEAD:main
