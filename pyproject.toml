[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bousai-blog"
version = "0.1.0"
description = "Disaster-prevention blog content management and freshness tools"
requires-python = ">=3.11"

[project.scripts]
bousai-blog-freshness = "bousai_blog.freshness:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
